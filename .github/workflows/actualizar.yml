name: Actualizar Pronósticos Diario

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar actualización desde ESPN
        run: python actualizar_datos.py

      - name: Guardar cambios automáticamente
        run: |
          git config --global user.name "Bot Automático"
          git config --global user.email "bot@actions.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git status
          git add -A
          git commit -m "Actualización automática de resultados [skip ci]" || echo "Sin cambios"
          git push origin principal
permissions: 
